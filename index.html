<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>París en familia</title>
<meta name="description" content="Itinerario familiar a París, del 30 de octubre al 2 de noviembre de 2026">
<meta name="theme-color" content="#E6EAEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1322" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="París">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="vendor/fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
@font-face{font-family:"Barlow";src:url(vendor/fonts/barlow-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(vendor/fonts/barlow-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow";src:url(vendor/fonts/barlow-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow";src:url(vendor/fonts/barlow-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(vendor/fonts/barlow-condensed-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(vendor/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(vendor/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

/* Paleta: el esmalte azul y el marco verde de las placas de calle de París,
   el gris zinc de los tejados y el ámbar de las farolas. */
:root{
  --bg:#E6EAEE; --surface:#FFFFFF; --sunk:#D9DFE5;
  --ink:#18213A; --ink-2:#56617A; --ink-3:#8590A3; --line:#D2D8DF;
  --plaque:#22346B; --frame:#2E6B4E; --amber:#E3A73B; --amber-ink:#8A5A0B;
  --ok:#2E6B4E; --todo-bg:#FBEBCB; --todo-ink:#8A5A0B;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --sans:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --lift:0 1px 0 rgba(24,33,58,.04),0 6px 18px -8px rgba(24,33,58,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1322; --surface:#161F35; --sunk:#111A2D;
    --ink:#E9EDF4; --ink-2:#A3AEC3; --ink-3:#6E7A92; --line:#25304A;
    --plaque:#2C4592; --frame:#3C8A63; --amber:#F0B54D; --amber-ink:#F0B54D;
    --ok:#5DBB8A; --todo-bg:#3A2D14; --todo-ink:#F0C46E;
    --lift:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:0 0 auto}
[hidden]{display:none!important}

#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 24px}

/* ---------- placa de calle ---------- */
.plaque{display:inline-block;background:var(--plaque);border:3px solid var(--frame);border-radius:9px;padding:2px;color:#fff;
  box-shadow:0 2px 0 rgba(0,0,0,.12)}
.plaque-in{border:1.5px solid rgba(255,255,255,.9);border-radius:6px;padding:3px 12px 4px;text-align:center;line-height:1.05}
.plaque-in small{display:block;font:500 12px/1.2 var(--cond);letter-spacing:.04em;opacity:.92}
.plaque-in b{display:block;font:600 24px/1.05 var(--cond);letter-spacing:.01em}
.plaque.sm .plaque-in b{font-size:19px}
.plaque.street{display:block;margin-bottom:14px}
.plaque.street .plaque-in{padding:6px 16px 9px}
.plaque.street .plaque-in small{font-size:14px}
.plaque.street .plaque-in b{font-size:34px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- escena ilustrada ---------- */
.scene{margin:0 -16px;aspect-ratio:2/1;max-height:300px;overflow:hidden;position:relative}
.scene svg{width:100%;height:100%;display:block}
@media (min-width:640px){ .scene{margin:0;border-radius:var(--r-lg)} }

/* ---------- textos de cabecera ---------- */
.hero-text{padding:18px 0 4px}
.hero-text .plaque{margin-bottom:12px}
.kicker{margin:0 0 2px;font:600 16px/1.3 var(--cond);color:var(--ink-2);letter-spacing:.02em}
.count{font:700 54px/1 var(--cond);margin:0 0 10px;letter-spacing:-.01em}
.day-title{font:700 36px/1.05 var(--cond);margin:0 0 10px;letter-spacing:-.005em;text-wrap:balance}
.lead{margin:0 0 12px;color:var(--ink-2);font-size:16px;line-height:1.55;max-width:60ch}
.pagehead{padding:12px 0 4px}
.pagehead h1{font:700 44px/1 var(--cond);margin:0 0 8px}
.note{font-size:13px;color:var(--ink-3);line-height:1.45;margin:10px 0 0}
.muted{color:var(--ink-3);font-size:13px}

.block{margin-top:26px}
.block > h2{font:600 22px/1.15 var(--cond);margin:0 0 12px;letter-spacing:.005em}

/* ---------- metro ---------- */
.ml{display:inline-grid;place-items:center;min-width:1.45em;height:1.45em;padding:0 .25em;border-radius:1em;background:var(--c);color:var(--t);
  font:700 .78em/1 var(--sans);vertical-align:.08em;margin:0 .1em}

/* ---------- tiempo ---------- */
.wx{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.wx b{font:600 20px/1 var(--cond);color:var(--ink)}
.wx .lo{color:var(--ink-3)}
.wx .wxl{color:var(--ink)}
.wx .rain{display:inline-flex;align-items:center;gap:2px;color:var(--ink-3)}
.wx .rain .ic{width:14px;height:14px}
.wx.full{flex-wrap:wrap;gap:6px 10px}
.wxi{width:28px;height:28px;color:var(--ink-3)}
.wxrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wxday{background:var(--surface);border-radius:var(--r-md);padding:10px 6px;box-shadow:var(--lift);display:grid;justify-items:center;gap:4px;text-align:center}
.wxday .wd{font:600 15px/1 var(--cond);color:var(--ink-2)}
.wxday .wx{flex-direction:column;gap:2px}
.wxday .wx .rain{font-size:12px}

/* ---------- checks ---------- */
.chk{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.chk .ic{width:16px;height:16px;stroke-width:3}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.meter{height:5px;border-radius:5px;background:var(--sunk);overflow:hidden;margin:4px 0 12px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .3s}
.checks{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--lift)}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks li > div{padding-top:3px}
.checks small{display:block;color:var(--ink-3);font-size:13.5px;line-height:1.4;margin-top:1px}
.checks li.on span{text-decoration:line-through;color:var(--ink-3)}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font:600 14px/1 var(--sans);
  border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--surface)}
.btn .ic{width:17px;height:17px}
.btn.primary{background:var(--plaque);border-color:var(--plaque);color:#fff}
.btn.ghost{background:transparent}
.btn.wide{display:flex;width:100%;padding:14px}

/* ---------- tarjetas de día (Hoy) ---------- */
.daycards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daycard{background:var(--surface);border-radius:var(--r-md);overflow:hidden;text-align:left;box-shadow:var(--lift);border-bottom:4px solid var(--dc)}
.daycard .scene{margin:0;aspect-ratio:16/9;border-radius:0}
.daycard div{padding:8px 10px 10px}
.daycard span{display:block;font:600 14px/1.2 var(--cond);color:var(--ink-3)}
.daycard b{display:block;font:600 17px/1.2 var(--cond)}

/* ---------- ahora / siguiente ---------- */
.nowcard{margin-top:14px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--lift);overflow:hidden}
.nowcard .lbl{display:block;font:600 14px/1 var(--cond);color:var(--ink-3);margin-bottom:8px;letter-spacing:.02em}
.now-now{padding:14px 16px;border-left:5px solid var(--amber)}
.now-next{padding:14px 16px;border-top:1px solid var(--line)}
.now-row{display:flex;gap:12px;align-items:flex-start}
.now-row b{display:block;font:600 22px/1.15 var(--cond)}
.now-row small{display:block;color:var(--ink-2);font-size:14px;margin-top:3px;line-height:1.4}
.now-next .btn{margin-top:12px}
.kind{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sunk);color:var(--ink);flex:0 0 auto}
.kind .ic{width:20px;height:20px}
.now-now .kind{background:var(--amber);color:#2A1B00}

.mini{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--lift)}
.mini li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.mini li:first-child{border-top:0}
.mini .mt{font:600 16px/1 var(--cond);color:var(--ink-2);width:42px}
.mini .kind{width:32px;height:32px}
.mini .kind .ic{width:17px;height:17px}
.mini .mtt{flex:1;text-align:left;font-weight:500;font-size:15px;line-height:1.3;padding:6px 0}
.mini li.on .mtt{text-decoration:line-through;color:var(--ink-3)}

/* ---------- plan: placas de día ---------- */
.plaques{display:flex;gap:8px;padding:0 0 14px;justify-content:space-between}
.dayplaque{flex:1;position:relative;opacity:.55;transition:opacity .15s,transform .15s}
.dayplaque .plaque{display:block}
.dayplaque .plaque-in{padding:3px 4px 5px}
.dayplaque.sel{opacity:1;transform:translateY(-2px)}
.dayplaque.today::after{content:"Hoy";position:absolute;top:-8px;right:-4px;background:var(--amber);color:#2A1B00;font:700 11px/1 var(--sans);padding:3px 6px;border-radius:99px}
.dayfacts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.progress-txt{font:600 15px/1 var(--cond);color:var(--ink-3)}

/* ---------- plan: línea de tiempo ---------- */
.timeline{list-style:none;margin:16px 0 0;padding:0;position:relative;--dl:var(--dc)}
@media (prefers-color-scheme: dark){ .timeline{--dl:color-mix(in srgb,var(--dc) 55%,#fff)} }
.timeline::before{content:"";position:absolute;left:66px;top:20px;bottom:20px;width:3px;border-radius:3px;
  background:repeating-linear-gradient(var(--dl) 0 6px,transparent 6px 11px);opacity:.55}
.stop{display:grid;grid-template-columns:44px 46px 1fr;margin-bottom:12px;align-items:start}
.stop .t{font:600 19px/1 var(--cond);padding-top:19px;color:var(--ink-2);text-align:left}
.stop .t small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.stop .node{display:grid;justify-items:center;padding-top:9px;position:relative;z-index:1}
.stop .node .kind{width:36px;height:36px;background:var(--surface);border:2.5px solid var(--dl);color:var(--ink)}
.stop.fixed .node .kind{background:var(--dc);border-color:var(--dl);color:#fff}
.stop.done .node .kind{background:var(--ok);border-color:var(--ok);color:#fff}
.stop.current .node .kind{box-shadow:0 0 0 5px color-mix(in srgb,var(--amber) 45%,transparent);border-color:var(--amber)}
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--lift);position:relative;min-width:0}
.stop.current .card{outline:2px solid var(--amber)}
.card > header{display:flex;gap:10px;align-items:flex-start;padding:13px 12px 12px 14px}
.card > header[data-tog]{cursor:pointer;padding-bottom:22px}
.card .ttl{flex:1;min-width:0}
.card h3{margin:0;font:600 20px/1.15 var(--cond);letter-spacing:.005em}
.card p{margin:5px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.45}
.stop.done h3{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.stop.done .card p{color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags:not(:empty){margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--sans);padding:5px 9px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}
.tag .ic{width:14px;height:14px}
.tag.res{background:var(--plaque);color:#fff}
.tag.todo{background:var(--todo-bg);color:var(--todo-ink)}
.tag.now{background:var(--amber);color:#2A1B00}
.morebtn{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:44px;height:20px;display:grid;place-items:center;color:var(--ink-3)}
.morebtn .ic{width:18px;height:18px;transition:transform .2s}
.stop.open .morebtn .ic{transform:rotate(180deg)}
.more{padding:0 14px 26px;border-top:1px dashed var(--line);margin:0 12px}
.more ul{margin:12px 0 0;padding:0 0 0 18px;color:var(--ink);font-size:14.5px;line-height:1.5}
.more li{margin-bottom:6px}
.more li::marker{color:var(--dl)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

textarea{width:100%;min-height:110px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  padding:12px 14px;font:16px/1.5 var(--sans);resize:vertical}

/* ---------- mapa ---------- */
#app[data-tab="mapa"]{padding-top:calc(env(safe-area-inset-top) + 10px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--surface);
  box-shadow:var(--lift);font:600 15px/1 var(--cond)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--dc)}
.chip.sel{background:var(--ink);color:var(--bg)}
.mapbox{position:relative;margin:0 -16px}
#map{height:calc(100dvh - 210px - env(safe-area-inset-bottom) - env(safe-area-inset-top));min-height:360px;background:var(--sunk)}
@media (min-width:640px){ .mapbox{margin:0} #map{border-radius:var(--r-lg)} }
.mapctl{position:absolute;right:12px;bottom:28px;display:grid;gap:8px;z-index:500}
.fab{width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.pin{width:30px;height:30px;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font:700 15px/1 var(--cond);
  border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.done{background:#2E6B4E}
.pin.current{box-shadow:0 0 0 5px rgba(227,167,59,.75),0 2px 6px rgba(0,0,0,.35)}
.pin.hotel{width:34px;height:34px;background:#22346B;border-color:#2E6B4E;border-width:3px;border-radius:9px}
.pin.hotel .ic{width:19px;height:19px;color:#fff}
.pin.sm{width:26px;height:26px;font-size:14px;border-width:2px;box-shadow:none;flex:0 0 auto}
.me{width:18px;height:18px;border-radius:50%;background:#2B7BE4;border:3px solid #fff;box-shadow:0 0 0 7px rgba(43,123,228,.25)}
.leaflet-container{font-family:var(--sans);background:var(--sunk)}
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.4;color:#18213A}
.leaflet-popup-content .pd{display:block;font:600 13px/1.2 var(--cond);color:#56617A;margin-bottom:2px}
.leaflet-popup-content b{display:block;font:600 18px/1.15 var(--cond)}
.leaflet-popup-content p{margin:4px 0 8px;color:#56617A}
.leaflet-popup-content a{color:#22346B;font-weight:700}
@media (prefers-color-scheme: dark){ .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.45)} }
.mlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.mlist button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border-radius:var(--r-sm);padding:9px 12px;box-shadow:var(--lift)}
.mlist .mt{font:600 16px/1 var(--cond);color:var(--ink-2);flex:0 0 auto}
.mlist .mtt{font-weight:500;font-size:15px;flex:1;min-width:0}
.mlist .legend button{padding:13px 14px}
.mlist .legend i{width:12px;height:12px;border-radius:50%;background:var(--dc);flex:0 0 auto}
.mlist .legend span{flex:1;font-size:15px}
.mlist .legend b{font:600 17px/1 var(--cond);margin-right:4px}
.ic.r{transform:rotate(-90deg);color:var(--ink-3)}

/* ---------- guía ---------- */
.lines{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--lift)}
.lines li{display:flex;gap:14px;align-items:flex-start;padding:13px 14px;border-top:1px solid var(--line)}
.lines li:first-child{border-top:0}
.lines li > .ml{font-size:19px;margin:0;flex:0 0 auto}
.lines p{margin:0;font-size:15px;line-height:1.45}
.phrases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phrases li{background:var(--surface);border-radius:var(--r-md);padding:12px 12px 11px;box-shadow:var(--lift)}
.phrases b{display:block;font:600 20px/1.1 var(--cond);color:var(--plaque)}
@media (prefers-color-scheme: dark){ .phrases b{color:#9DB4F0} }
.phrases .say{display:block;font-style:italic;color:var(--ink-2);font-size:14px;margin-top:3px}
.phrases small{display:block;color:var(--ink-3);font-size:13px;margin-top:4px}
.eat{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--lift)}
.eat li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.eat li:first-child{border-top:0}
.eat li > div{flex:1;min-width:0}
.eat small{display:block;font:600 13px/1.2 var(--cond);color:var(--ink-3)}
.eat b{display:block;font:600 19px/1.15 var(--cond)}
.eat p{margin:2px 0;font-size:14.5px;color:var(--ink-2);line-height:1.4}
.eat .addr{font-size:13px;color:var(--ink-3)}
.tips{margin:0;display:grid;gap:8px}
.tips > div{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--lift);border-left:4px solid var(--frame)}
.tips dt{font:600 18px/1.2 var(--cond)}
.tips dd{margin:3px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.45}
.sos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sosbtn{background:var(--surface);border-radius:var(--r-md);padding:12px 8px;text-decoration:none;text-align:center;box-shadow:var(--lift);display:grid;justify-items:center;gap:2px}
.sosbtn .ic{color:#C0392B}
.sosbtn b{font:700 30px/1 var(--cond)}
.sosbtn span{font-size:12px;color:var(--ink-2);line-height:1.25}
.embassy{margin-top:8px;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--lift)}
.embassy div{flex:1}
.embassy b{font:600 18px/1.2 var(--cond)}
.embassy p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}

/* ---------- viaje: tarjetas de embarque ---------- */
.pass{background:var(--plaque);color:#fff;border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;position:relative}
.pass::before,.pass::after{content:"";position:absolute;top:44px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.pass::before{left:-9px}.pass::after{right:-9px}
.pass-top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px dashed rgba(255,255,255,.3);font:500 15px/1 var(--cond)}
.pass-top b{font:700 19px/1 var(--cond);letter-spacing:.04em}
.pass-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 18px 16px}
.pass-route .r{text-align:right}
.iata{display:block;font:700 46px/1 var(--cond);letter-spacing:.02em}
.pass-route small{display:block;font-size:13px;opacity:.8;margin-top:2px}
.pass-route .hr{display:block;font:600 22px/1 var(--cond);color:var(--amber);margin-top:8px}
.pass-plane .ic{width:30px;height:30px;transform:rotate(90deg);opacity:.85}
.hotel{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--lift)}
.hotel p{margin:0 0 10px;font-size:15.5px;line-height:1.5}
.hotel .metroline{color:var(--ink-2)}
.tickets{display:grid;gap:10px}
.ticket{display:flex;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--lift);overflow:hidden}
.ticket .stub{width:58px;display:grid;place-items:center;background:var(--plaque);color:#fff;border-right:2px dashed rgba(255,255,255,.35);flex:0 0 auto}
.ticket.pending .stub{background:var(--sunk);color:var(--ink-2);border-right-color:var(--line)}
.ticket .stub .ic{width:26px;height:26px}
.tk-body{padding:11px 14px 12px;flex:1;min-width:0;display:grid;gap:2px;justify-items:start}
.tk-body small{font:600 14px/1.2 var(--cond);color:var(--ink-3)}
.tk-body b{font:600 21px/1.1 var(--cond)}
.tk-body > span:not(.tag){font-size:14px;color:var(--ink-2)}
.tk-body .tag{margin-top:4px}
.code{width:100%;margin-top:8px;border:1.5px dashed var(--line);border-radius:var(--r-sm);background:transparent;color:var(--ink);padding:8px 10px;font:600 15px/1.2 var(--sans);letter-spacing:.04em}
.code::placeholder{font-weight:400;letter-spacing:0;color:var(--ink-3)}

/* ---------- barra de pestañas ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar nav{display:flex;width:100%;max-width:520px}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--ink-3);font:600 13px/1 var(--cond);letter-spacing:.02em;border-radius:12px}
.tabbar button .ic{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--plaque)}
@media (prefers-color-scheme: dark){ .tabbar button[aria-current="page"]{color:var(--amber)} }
.offline-pill{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:1001;
  background:var(--ink);color:var(--bg);font:600 13px/1 var(--sans);padding:7px 12px;border-radius:99px}


/* ---------- entradas guardadas ---------- */
.attach{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.attach .muted{font-size:13px}
.attach .btn.ghost{border-color:transparent;padding:9px 8px}
.btn.danger{color:#C0392B}
.tktip{font-size:13.5px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.pass-foot{padding:0 18px 16px}
.pass-foot .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.pass-foot .btn.primary{background:var(--amber);border-color:var(--amber);color:#2A1B00}
.pass-foot .muted{color:rgba(255,255,255,.7)}
.pass-foot .attach{margin-top:0}
.viewer{position:fixed;inset:0;z-index:3000;background:#0B0F1A;display:flex;flex-direction:column}
.vhead{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.vtitle{flex:1;font:600 22px/1.1 var(--cond);margin:0}
.vclose{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.vhint{margin:0;padding:8px 16px;font-size:13px;color:#C9D1DE;background:rgba(255,255,255,.06)}
.vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(24px + env(safe-area-inset-bottom));display:grid;gap:14px;align-content:start;justify-items:center}
.vfig{margin:0;width:100%;max-width:900px}
.vpage{display:block;width:100%;height:auto;background:#fff;border-radius:6px}
.vfig figcaption{text-align:center;color:#8C96A8;font-size:12px;margin-top:6px}
.vload{color:#C9D1DE;text-align:center;margin-top:40px}
body.noscroll{overflow:hidden}

@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>

  <nav aria-label="Secciones">
    <button data-tab="hoy"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
